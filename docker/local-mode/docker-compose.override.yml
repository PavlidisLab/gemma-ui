# Local-api GEMMA_BASE_URL override.
#
# Default targets host.docker.internal:8080 — the standalone
# gemma-rest container Paul typically has running on the host's port
# 8080 (separate from the in-stack `gemma-rest` profile service in
# the base compose, which isn't started in most local sessions).
# Override via the GEMMA_BASE_URL env var to point at staging-gemma,
# frink, prod, or the in-stack service when --profile gemma is up:
#
#   GEMMA_BASE_URL=http://frink.msl.ubc.ca:8080 docker compose up -d local-api
#   GEMMA_BASE_URL=https://staging-gemma.msl.ubc.ca docker compose up -d local-api
#   GEMMA_BASE_URL=http://gemma-rest:8080 docker compose --profile gemma up -d
#
# Used by:
#   * /datasets/{id}/curations live curation row fetch
#     (curation_versions._fetch_live_design_from_upstream, 2026-06-08).
#   * Existing proxy / sample / publications fetches.
services:
  local-api:
    environment:
      GEMMA_BASE_URL: ${GEMMA_BASE_URL:-http://host.docker.internal:8080}
