# docker-compose for the curation "local mode" stack.
#
# Brings up:
#   local-api    Python FastAPI (gca mock-gemma serve)        :8095
#   proposer     Python FastAPI (gca proposer-service serve)  :8082
#   curation-ui  Vite dev server                              :5175
#
# All three services bind-mount source from the host, so edits on
# the host take effect without a rebuild (Python pip install -e + Vite HMR).
#
# Two optional services for a fully self-contained Linux box —
# enable them with ``--profile gemma``:
#   gemma-rest   Tomcat hosting the gemma-rest WAR              :8080
#   gemma-db     MySQL seeded with a curation snapshot          :3306
#
# Without the ``gemma`` profile, the proposer + local-api still
# function but call out to whatever ``GEMMA_BASE_URL`` resolves to —
# set it to your own Gemma instance.

# Note: ``version:`` field intentionally omitted — modern compose
# (v2.x) ignores it and warns when present.

services:
  # ─── local_api — curation backend ──────────────────────────────
  local-api:
    build:
      context: .
      dockerfile: Dockerfile.agents
      # ``agents`` is referenced in Dockerfile.agents via
      # ``COPY --from=agents pyproject.toml`` so deps install at build
      # time. ``AGENTS_REPO`` lets ./up.sh / the host override the
      # default sibling-checkout path; falls back to the conventional
      # layout otherwise.
      additional_contexts:
        agents: ${AGENTS_REPO:-../../../gemma-curation-agents}
    image: gemma-local-mode/agents:dev
    container_name: curation-localstore-api
    working_dir: /agents
    environment:
      # local_api needs the curation API bearer to match what the
      # proposer + curation UI send. Wrapper script
      # (``./up.sh``) injects this from keychain or falls back to
      # ``dev-token-123``.
      GEMMA_CURATION_API_KEY: ${GEMMA_CURATION_API_KEY:-dev-token-123}
      # Credentials local_api uses when it calls gemma-rest's admin
      # endpoints (e.g. POST /admin/tasks/geo-scrape via
      # /rest/v2/scrape/dry-run). Defaults to the local-mode seeded
      # ``groupadmin`` user; override for staging / prod targets.
      GEMMA_USERNAME: ${GEMMA_USERNAME:-groupadmin}
      GEMMA_PASSWORD: ${GEMMA_PASSWORD:-groupadmin}
      # Upstream gemma-rest base. Matches the proposer service so
      # local_api's `_gemma_base()` lookup resolves to the same target
      # — needed for ``fetch_geo_scrape_dry_run`` and any other
      # local_api → gemma-rest passthroughs. Default points at the
      # local-mode compose container; override for staging / prod.
      GEMMA_BASE_URL: ${GEMMA_BASE_URL:-http://gemma-rest:8080}
    volumes:
      - ${AGENTS_REPO:-../../../gemma-curation-agents}:/agents
    ports:
      - "8095:8000"
    command: ["python", "-m", "gemma_curation_agents.cli", "mock-gemma", "serve", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      # ``/health`` is local_api's real liveness/readiness surface
      # ({"status":"ok",...}, no auth, cheap) — it reports the app
      # actually SERVING, unlike ``/openapi.json`` which FastAPI mounts
      # at import time and returns 200 even while the app is still
      # coming up. Must be ``CMD-SHELL``: the ``|| exit 1`` are shell
      # operators, so the previous exec-form ``CMD`` list handed them
      # to curl as literal URL args → curl exited 7 on the bogus
      # "||"/"exit"/"1" hosts and the container was wrongly marked
      # unhealthy (FailingStreak grew forever) even though it served
      # fine. (The earlier ``/rest/v2/`` probe 404'd — routes live
      # under specific paths, not the bare prefix.)
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  # ─── proposer — long-running FastAPI for /propose, /audit, /find-* ──
  proposer:
    image: gemma-local-mode/agents:dev
    container_name: curation-agent-api
    depends_on:
      - local-api
    working_dir: /agents
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # OpenAI key — required by the cell-line RAG resolver's embedding
      # query (text-embedding-3-large). Empty default keeps `up` working
      # without it; when unset the resolver gates off and the chain falls
      # through to the lexical resolver. To ENABLE cell-line RAG in-
      # container you ALSO need the index mounted — see the commented
      # `cell_line_rag` volume below and scripts/cell_line_rag/README.md.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CELL_LINE_RAG_INDEX_DIR: ${CELL_LINE_RAG_INDEX_DIR:-}
      # Ontology term index (per-ontology ``terms.parquet``), mounted
      # read-only below. Without it every ontology lookup that reads the
      # index answers "I don't know" — and for ``POST /validate-terms``
      # that is a SILENT failure by design: an unnameable URI is spec'd as
      # `unknown` / "not checked", never red, so the curator's Validate
      # button comes back clean on an experiment it never checked.
      # Measured 2026-08-13: 100% `unknown` in-container vs ok /
      # label_mismatch for the same triples on the host.
      EMBEDDING_INDEX_DIR: /ontology_index
      GEMMA_CURATION_API_KEY: ${GEMMA_CURATION_API_KEY:-dev-token-123}
      # Proposer points at local-api over the compose network.
      GEMMA_CURATION_URL: http://local-api:8000
      # Read-side Gemma — REQUIRED, no fallback (set it to your own
      # Gemma instance, or GEMMA_BASE_URL=http://gemma-rest:8080 for
      # the self-contained Linux setup with --profile gemma).
      GEMMA_BASE_URL: ${GEMMA_BASE_URL:?GEMMA_BASE_URL must be set — e.g. https://gemma.example.org or http://gemma-rest:8080 with --profile gemma}
      # Ontology-search host for the resolver's /rest/v2/annotations/search.
      # SEPARATE knob from GEMMA_BASE_URL (usually the same value). The
      # resolver REFUSES to fall back to GEMMA_CURATION_URL (the store has no
      # annotation index), so the proposer service errors without this. Default
      # to GEMMA_BASE_URL when unset so a single export configures both.
      GEMMA_ONTOLOGY_URL: ${GEMMA_ONTOLOGY_URL:-${GEMMA_BASE_URL}}
      # Match local_api: gemma-rest admin credentials. Same defaults so
      # both services authenticate as the seeded ``groupadmin`` against
      # local-mode gemma-rest; both flip together for staging / prod.
      GEMMA_USERNAME: ${GEMMA_USERNAME:-groupadmin}
      GEMMA_PASSWORD: ${GEMMA_PASSWORD:-groupadmin}
      # Write consent. Every MUTATING Gemma call routes through
      # ``shared/gemma.py::require_gemma_write_base``, which refuses
      # unless this is set AND matches the URL about to be written.
      # Reads may default; writes may not.
      #
      # 🛑 It was not plumbed here at all until 2026-08-25, which is a
      # worse failure than being unset: exporting it on the host looked
      # like consent and never reached the container, so every write
      # kept refusing with no sign that the variable had been ignored.
      # Empty default preserves exactly today's behaviour — the guard
      # refuses — for anyone who does not set it.
      #
      # 🛑 Set it ONLY together with GEMMA_BASE_URL, and to the same
      # host. Setting it while GEMMA_BASE_URL still names production is
      # what removes the only thing standing between an administrator
      # principal and a production write; it is safe because the base
      # URL names a sandbox, not because this variable is set.
      GEMMA_WRITE_TARGET: ${GEMMA_WRITE_TARGET:-}
      # Optional Zotero credentials for biolit fetcher.
      GEMMA_AGENTS_USE_ZOTERO: ${GEMMA_AGENTS_USE_ZOTERO:-}
      ZOTERO_API_KEY: ${ZOTERO_API_KEY:-}
      ZOTERO_USER_ID: ${ZOTERO_USER_ID:-}
      ZOTERO_GROUP_ID: ${ZOTERO_GROUP_ID:-}
    volumes:
      - ${AGENTS_REPO:-../../../gemma-curation-agents}:/agents
      # To ENABLE the cell-line RAG resolver in-container, mount the prebuilt
      # index read-only and set (above) CELL_LINE_RAG_INDEX_DIR=/cell_line_rag
      # + OPENAI_API_KEY. The host path is the index built by
      # scripts/cell_line_rag/ (default ~/Data/gemma-curation-agents-data/
      # cell_line_rag). Left commented because a bind-mount of an absent host
      # path breaks `up`; uncomment once the index exists. See
      # scripts/cell_line_rag/README.md.
      # - ${CELL_LINE_RAG_HOST_DIR:-${HOME}/Data/gemma-curation-agents-data/cell_line_rag}:/cell_line_rag:ro
      # Ontology index — read-only, ~565 MB, built by the agents repo's
      # ontology index builder (default ~/Data/ontology_index, one
      # subdirectory per ontology: EFO, CLO, CL, UBERON, MONDO, …).
      # NOT commented out like cell_line_rag above: /validate-terms is a
      # curator-facing check and its no-index behaviour is a green light on
      # an unchecked experiment, which is worse than the feature being
      # absent. On a box without the index, point ONTOLOGY_INDEX_HOST_DIR
      # at an existing directory (the endpoint then degrades to `unknown`)
      # or comment this line and drop EMBEDDING_INDEX_DIR above.
      - ${ONTOLOGY_INDEX_HOST_DIR:-${HOME}/Data/ontology_index}:/ontology_index:ro
      # NCBI gene_info dumps (human / mouse / rat), read-only. Gemma binds gene
      # perturbations to purl.org/commons/record/ncbi_gene/<entrez>, which is
      # not an ontology term and so is absent from the index above — without
      # this, every genotype tag and every genotype statement subject validates
      # as `unknown` (26% of statement slots, measured 2026-08-13). The
      # validator reads this cache ONLY; it never downloads, so an absent
      # directory degrades to `unknown` rather than blocking a request.
      - ${GENE_INFO_CACHE_HOST_DIR:-${HOME}/.cache/gemma_curation_agents}:/root/.cache/gemma_curation_agents:ro
    ports:
      - "8082:8000"
    command: ["python", "-m", "gemma_curation_agents.cli", "proposer-service", "serve", "--host", "0.0.0.0", "--port", "8000"]

  # ─── curation UI — Vite dev server ─────────────────────────────
  curation-ui:
    build:
      context: .
      dockerfile: Dockerfile.curation-ui
    image: gemma-local-mode/curation-ui:dev
    container_name: curation-ui
    depends_on:
      - local-api
      - proposer
    working_dir: /ui
    environment:
      # Curation UI default upstream is local_api: workflow management,
      # dataset metadata (preboarding / curation state), groups /
      # candidates / pipeline-status all live there. gemma-rest 2.0 is
      # the FALLBACK for endpoints local_api doesn't carry — currently
      # the SVD-based diagnostics (svd / sample-correlation / mean-
      # variance / svd/loadings). The narrow routing exception lives
      # in vite.config.ts.
      #
      # Override key is GEMMA_CURATION_UI_BACKEND (not _URL) — the
      # agent service exports GEMMA_CURATION_URL pointing at local_api
      # for its OWN use; without a distinct name, that shell-exported
      # value silently leaked in here. Set GEMMA_CURATION_UI_BACKEND=
      # http://host.docker.internal:8080 at compose-up time to flip the
      # UI default at gemma-rest instead (e.g. for testing remote-mode
      # behavior end-to-end against a Gemma stack).
      GEMMA_CURATION_URL: ${GEMMA_CURATION_UI_BACKEND:-http://local-api:8000}
      # Diagnostics-only upstream — used for the routing exceptions in
      # vite.config.ts. Override via GEMMA_REST_URL.
      GEMMA_REST_URL: ${GEMMA_REST_URL:-http://host.docker.internal:8080}
      # Ontology-search source (/rest/v2/annotations/search). Must be a
      # gene-aware, category-tagged Gemma instance — not every Gemma
      # deployment's ontology search qualifies (some return only
      # phenotype terms and miss gene hits). Override via
      # GEMMA_ONTOLOGY_URL; unset disables the ontology routing
      # exception (see apps/curation/vite.config.ts).
      GEMMA_ONTOLOGY_URL: ${GEMMA_ONTOLOGY_URL:-}
      # Explicit local_api passthrough for hooks that need to bypass
      # a gemma-rest routing exception (e.g. audit-trail fallback).
      # Defaults to the same target as GEMMA_CURATION_URL.
      GEMMA_LOCAL_API_URL: ${GEMMA_LOCAL_API_URL:-http://local-api:8000}
      GEMMA_PROPOSER_URL: http://proposer:8000
      VITE_GEMMA_CURATION_API_KEY: ${GEMMA_CURATION_API_KEY:-dev-token-123}
      # Backend-mode flag, read once at boot by lib/gemmaMode.ts.
      #
      # 🛑 This is a CAPABILITY + DISPLAY flag, not a routing switch.
      # api/client.ts calls `fetch(path)` with a RELATIVE path on every
      # request, so where calls actually land is decided entirely by the
      # proxy table in apps/curation/vite.config.ts — pointing the
      # backends at a different Gemma does not move the UI out of local
      # mode, and flipping this does not move any request.
      #
      # What it does change: local mode hides the SVD diagnostics and
      # the real Gemma audit-event history client-side, and serves a
      # synthetic curator from useMe() so sign-out is a no-op. Remote
      # mode shows both and turns on the real login/logout path.
      #
      # ⚠️ Set VITE_GEMMA_BASE_URL alongside it. Remote mode refuses to
      # default the base and renders "(unset)" in the mode chip rather
      # than silently pointing somewhere nobody asked for.
      #
      # There was no passthrough here at all before 2026-08-27, so the
      # mode could not be set without editing this file. Interim knob:
      # once the store serves GET /rest/v2/__config__, runtime config
      # takes precedence over these and the mode becomes switchable
      # without a restart.
      VITE_GEMMA_MODE: ${VITE_GEMMA_MODE:-}
      VITE_GEMMA_BASE_URL: ${VITE_GEMMA_BASE_URL:-}
      # Where the top bar's "Browse" / "Admin" tabs point. The browser
      # site and the curation site are separate vite builds on different
      # origins, so those links need an absolute URL to the OTHER app.
      #
      # Falls back to http://localhost:5183 (lib/appLinks.ts), the
      # local-mode browser container — correct for local dev and wrong
      # anywhere else. Like VITE_GEMMA_MODE, there was no passthrough
      # here before 2026-08-27, so it could not be set without editing
      # this file.
      #
      # ⚠️ It must point at a host serving the BROWSER APP, not at a
      # Gemma REST host: `Admin` resolves to `<url>/admin/system`, which
      # is a route in our browser app. gemma2.msl.ubc.ca 404s on both
      # /browser and /admin/system (measured 2026-08-27), so pointing
      # this at it produces two dead links.
      VITE_BROWSER_URL: ${VITE_BROWSER_URL:-}
      # Vite watcher fallback — bind-mounts on Docker-on-macOS don't
      # deliver inotify events from the host, so HMR misses workspace
      # package edits (@gemma/heatmap, @gemma/diagnostics, …) without
      # this. See apps/curation/vite.config.ts ``server.watch``.
      VITE_USE_POLLING: "1"
    extra_hosts:
      # Docker Desktop auto-adds host.docker.internal; on Linux
      # Docker the host-gateway alias is needed explicitly.
      - "host.docker.internal:host-gateway"
    volumes:
      # Bind-mount the whole monorepo so workspace links resolve.
      - ${UI_REPO:-../..}:/ui
      # Named volume on node_modules — keeps host (macOS) and
      # container (Linux) compiled deps from clashing.
      - ui-node-modules:/ui/node_modules
    ports:
      - "5175:5173"

  # ─── browser UI — Vite dev server (apps/browser, the GemBrow port) ──
  # Public-facing browse/search frontend. Talks to Gemma 2.0 REST
  # (NOT local_api). Default upstream is the host's local Gemma 2.0
  # on :8080 via host.docker.internal; override with GEMMA_BASE_URL
  # to point at staging / prod or the in-stack ``gemma-rest`` service
  # when ``--profile gemma`` is on.
  browser-ui:
    build:
      context: .
      dockerfile: Dockerfile.browser
    image: gemma-local-mode/browser-ui:dev
    container_name: browser-ui
    working_dir: /ui
    environment:
      # apps/browser/vite.config.ts requires GEMMA_BASE_URL — no
      # built-in fallback. Default here points at a local Gemma
      # instance on the host (:8080); flip
      # via the env var when standing up against the in-stack
      # gemma-rest container or a remote target.
      GEMMA_BASE_URL: ${GEMMA_BROWSER_BACKEND:-http://host.docker.internal:8080}
      # Vite watcher fallback — bind-mounts on Docker-on-macOS don't
      # deliver inotify events from the host, so HMR misses workspace
      # package edits (@gemma/heatmap, @gemma/diagnostics, …) without
      # this. See apps/browser/vite.config.ts ``server.watch``.
      VITE_USE_POLLING: "1"
    extra_hosts:
      # Docker Desktop auto-adds host.docker.internal; on Linux
      # Docker the host-gateway alias is needed explicitly so the
      # browser can reach the host's :8080 Gemma 2.0.
      - "host.docker.internal:host-gateway"
    volumes:
      # Bind-mount the whole monorepo so workspace links resolve;
      # named volume on node_modules keeps host/container compiled
      # deps from clashing.
      - ${UI_REPO:-../..}:/ui
      - browser-node-modules:/ui/node_modules
    ports:
      - "5183:5183"

  # ─── optional Gemma 2.0 (Tomcat + WAR) ──────────────────────────
  # Bring up with ``./up.sh --gemma`` or
  # ``docker compose --profile gemma up``.
  gemma-rest:
    profiles: ["gemma"]
    image: tomcat:10.1-jdk25-temurin
    container_name: gemma-local-mode-gemma-rest
    depends_on:
      gemma-db:
        condition: service_healthy
    environment:
      GEMMA_DB_HOST: gemma-db
      GEMMA_DB_PORT: "3306"
      GEMMA_DB_NAME: ${GEMMA_DB_NAME:-gemd}
      GEMMA_DB_USER: ${GEMMA_DB_USER:-gemmaadmin}
      GEMMA_DB_PASSWORD: ${GEMMA_DB_PASSWORD:-gemmatoast}
      # MySQL 8 uses caching_sha2_password by default; without TLS, the
      # connector needs allowPublicKeyRetrieval=true to fetch the RSA
      # public key for the auth handshake. Safe in local-mode (no real
      # secrets on the wire). Default keeps useSSL=false from
      # default.properties intact.
      GEMMA_DB_URLQUERY: ${GEMMA_DB_URLQUERY:-useSSL=false&allowPublicKeyRetrieval=true}
      # MySQL 8.0.13 removed NO_AUTO_CREATE_USER from valid sql_mode
      # flags; default.properties line 90 still lists it for prod
      # (which runs MySQL 5.7). Drop the flag for local-mode's
      # MySQL 8.0 image so the connection-init SET sql_mode succeeds.
      GEMMA_DB_HIKARI_SESSIONVARIABLES: ${GEMMA_DB_HIKARI_SESSIONVARIABLES:-sql_mode='STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION'}
      GEMMA_SENTINELS_IGNORE: "true"
      CATALINA_OPTS: "-Dspring.profiles.active=production"
    volumes:
      # WAR bind-mount from the Gemma source tree. Set GEMMA_WAR_PATH
      # to point at your Gemma checkout's built WAR.
      - ${GEMMA_WAR_PATH:-${HOME}/gemma/gemma-rest/target/gemma-rest.war}:/usr/local/tomcat/webapps/ROOT.war:ro
    ports:
      - "8080:8080"

  gemma-db:
    profiles: ["gemma"]
    image: mysql:8.0
    container_name: gemma-local-mode-gemma-db
    environment:
      MYSQL_DATABASE: ${GEMMA_DB_NAME:-gemd}
      MYSQL_USER: ${GEMMA_DB_USER:-gemmaadmin}
      MYSQL_PASSWORD: ${GEMMA_DB_PASSWORD:-gemmatoast}
      MYSQL_ROOT_PASSWORD: ${GEMMA_DB_ROOT_PASSWORD:-gemmatoast}
    volumes:
      - gemma-db-data:/var/lib/mysql
      # /docker-entrypoint-initdb.d runs once on first start (empty
      # data volume) BEFORE the real MySQL server accepts external
      # connections — no race with downstream consumers.
      #
      # Bootstrap order:
      #   1. 01-apply-migrations.sh — sources every gemma-core
      #      V*__*.sql in numeric version order (sort -V) so V2
      #      lands before V10. Replaces the manual Flyway step prod
      #      relies on (gemma's DatabaseSchemaUpdatePopulator is a
      #      no-op stub).
      #   2. 99-groupadmin-seed.sql — local-mode admin user.
      #
      # Set ``GEMMA_REPO`` if the gemma checkout isn't at
      # ``$HOME/gemma``.
      - ${GEMMA_REPO:-${HOME}/gemma}/gemma-core/src/main/resources/db/migration/mysql:/gemma-migrations:ro
      - ./apply-gemma-migrations.sh:/docker-entrypoint-initdb.d/01-apply-migrations.sh:ro
      - ./groupadmin-seed.sql:/docker-entrypoint-initdb.d/99-groupadmin-seed.sql:ro
    # Host port 3307 (not 3306) — a host MySQL may already hold 3306.
    # The gemma-rest container reaches gemma-db over the
    # compose network on the internal 3306, so this mapping is purely
    # for host-side debugging (``mysql -h 127.0.0.1 -P 3307 -u root``).
    ports:
      - "${GEMMA_DB_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${GEMMA_DB_ROOT_PASSWORD:-gemmatoast}"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  ui-node-modules:
  browser-node-modules:
  gemma-db-data:
