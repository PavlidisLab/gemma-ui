# docker-compose for the curation "local mode" stack.
#
# Brings up:
#   local-api    Python FastAPI (gca mock-gemma serve)        :8095
#   proposer     Python FastAPI (gca proposer-service serve)  :8082
#   curation-ui  Vite dev server                              :5175
#
# All three services bind-mount source from the host, so edits on
# the host take effect without a rebuild (Python pip install -e + Vite HMR).
#
# Two optional services for a fully self-contained Linux box —
# enable them with ``--profile gemma``:
#   gemma-rest   Tomcat hosting the gemma-rest WAR              :8080
#   gemma-db     MySQL seeded with a curation snapshot          :3306
#
# Without the ``gemma`` profile, the proposer + local-api still
# function but call out to whatever ``GEMMA_BASE_URL`` resolves to
# (staging by default).

# Note: ``version:`` field intentionally omitted — modern compose
# (v2.x) ignores it and warns when present.

services:
  # ─── local_api — curation backend ──────────────────────────────
  local-api:
    build:
      context: .
      dockerfile: Dockerfile.agents
      # ``agents`` is referenced in Dockerfile.agents via
      # ``COPY --from=agents pyproject.toml`` so deps install at build
      # time. ``AGENTS_REPO`` lets ./up.sh / the host override the
      # default sibling-checkout path; falls back to the conventional
      # layout otherwise.
      additional_contexts:
        agents: ${AGENTS_REPO:-../../../gemma-curation-agents}
    image: gemma-local-mode/agents:dev
    container_name: curation-localstore-api
    working_dir: /agents
    environment:
      # local_api needs the curation API bearer to match what the
      # proposer + curation UI send. Wrapper script
      # (``./up.sh``) injects this from keychain or falls back to
      # ``dev-token-123``.
      GEMMA_CURATION_API_KEY: ${GEMMA_CURATION_API_KEY:-dev-token-123}
      # Credentials local_api uses when it calls gemma-rest's admin
      # endpoints (e.g. POST /admin/tasks/geo-scrape via
      # /rest/v2/scrape/dry-run). Defaults to the local-mode seeded
      # ``groupadmin`` user; override for staging / prod targets.
      GEMMA_USERNAME: ${GEMMA_USERNAME:-groupadmin}
      GEMMA_PASSWORD: ${GEMMA_PASSWORD:-groupadmin}
      # Upstream gemma-rest base. Matches the proposer service so
      # local_api's `_gemma_base()` lookup resolves to the same target
      # — needed for ``fetch_geo_scrape_dry_run`` and any other
      # local_api → gemma-rest passthroughs. Default points at the
      # local-mode compose container; override for staging / prod.
      GEMMA_BASE_URL: ${GEMMA_BASE_URL:-http://gemma-rest:8080}
    volumes:
      - ${AGENTS_REPO:-../../../gemma-curation-agents}:/agents
    ports:
      - "8095:8000"
    command: ["python", "-m", "gemma_curation_agents.cli", "mock-gemma", "serve", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      # ``/openapi.json`` is FastAPI's auto-generated schema route —
      # exists as long as the app is up, no auth, no DB hit, no
      # per-route handler so the probe stays cheap. The previous
      # ``/rest/v2/`` probe 404'd (local_api routes live under
      # specific paths, not the bare prefix) and spammed the log
      # every 10s.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/openapi.json", "||", "exit", "1"]
      interval: 10s
      timeout: 3s
      retries: 6

  # ─── proposer — long-running FastAPI for /propose, /audit, /find-* ──
  proposer:
    image: gemma-local-mode/agents:dev
    container_name: curation-agent-api
    depends_on:
      - local-api
    working_dir: /agents
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMMA_CURATION_API_KEY: ${GEMMA_CURATION_API_KEY:-dev-token-123}
      # Proposer points at local-api over the compose network.
      GEMMA_CURATION_URL: http://local-api:8000
      # Read-side Gemma — override for self-contained Linux setup
      # (set GEMMA_BASE_URL=http://gemma-rest:8080 + use --profile gemma).
      GEMMA_BASE_URL: ${GEMMA_BASE_URL:-https://staging-gemma.msl.ubc.ca}
      # Match local_api: gemma-rest admin credentials. Same defaults so
      # both services authenticate as the seeded ``groupadmin`` against
      # local-mode gemma-rest; both flip together for staging / prod.
      GEMMA_USERNAME: ${GEMMA_USERNAME:-groupadmin}
      GEMMA_PASSWORD: ${GEMMA_PASSWORD:-groupadmin}
      # Optional Zotero credentials for biolit fetcher.
      GEMMA_AGENTS_USE_ZOTERO: ${GEMMA_AGENTS_USE_ZOTERO:-}
      ZOTERO_API_KEY: ${ZOTERO_API_KEY:-}
      ZOTERO_USER_ID: ${ZOTERO_USER_ID:-}
      ZOTERO_GROUP_ID: ${ZOTERO_GROUP_ID:-}
    volumes:
      - ${AGENTS_REPO:-../../../gemma-curation-agents}:/agents
    ports:
      - "8082:8000"
    command: ["python", "-m", "gemma_curation_agents.cli", "proposer-service", "serve", "--host", "0.0.0.0", "--port", "8000"]

  # ─── curation UI — Vite dev server ─────────────────────────────
  curation-ui:
    build:
      context: .
      dockerfile: Dockerfile.curation-ui
    image: gemma-local-mode/curation-ui:dev
    container_name: curation-ui
    depends_on:
      - local-api
      - proposer
    working_dir: /ui
    environment:
      # Curation UI default upstream is local_api: workflow management,
      # dataset metadata (preboarding / curation state), groups /
      # candidates / pipeline-status all live there. gemma-rest 2.0 is
      # the FALLBACK for endpoints local_api doesn't carry — currently
      # the SVD-based diagnostics (svd / sample-correlation / mean-
      # variance / svd/loadings). The narrow routing exception lives
      # in vite.config.ts.
      #
      # Override key is GEMMA_CURATION_UI_BACKEND (not _URL) — the
      # agent service exports GEMMA_CURATION_URL pointing at local_api
      # for its OWN use; without a distinct name, that shell-exported
      # value silently leaked in here. Set GEMMA_CURATION_UI_BACKEND=
      # http://host.docker.internal:8080 at compose-up time to flip the
      # UI default at gemma-rest instead (e.g. for testing remote-mode
      # behavior end-to-end against a Gemma stack).
      GEMMA_CURATION_URL: ${GEMMA_CURATION_UI_BACKEND:-http://local-api:8000}
      # Diagnostics-only upstream — used for the routing exceptions in
      # vite.config.ts. Override via GEMMA_REST_URL.
      GEMMA_REST_URL: ${GEMMA_REST_URL:-http://host.docker.internal:8080}
      # Ontology-search source (/rest/v2/annotations/search). Must be a
      # gene-aware, category-tagged Gemma — frink. staging-gemma is NOT
      # valid (gene-blind: returns only MP phenotype, missed IL7 on
      # GSE137893). Override via GEMMA_ONTOLOGY_URL.
      GEMMA_ONTOLOGY_URL: ${GEMMA_ONTOLOGY_URL:-http://frink.msl.ubc.ca:8080}
      # Explicit local_api passthrough for hooks that need to bypass
      # a gemma-rest routing exception (e.g. audit-trail fallback).
      # Defaults to the same target as GEMMA_CURATION_URL.
      GEMMA_LOCAL_API_URL: ${GEMMA_LOCAL_API_URL:-http://local-api:8000}
      GEMMA_PROPOSER_URL: http://proposer:8000
      VITE_GEMMA_CURATION_API_KEY: ${GEMMA_CURATION_API_KEY:-dev-token-123}
      # Vite watcher fallback — bind-mounts on Docker-on-macOS don't
      # deliver inotify events from the host, so HMR misses workspace
      # package edits (@gemma/heatmap, @gemma/diagnostics, …) without
      # this. See apps/curation/vite.config.ts ``server.watch``.
      VITE_USE_POLLING: "1"
    extra_hosts:
      # Docker Desktop auto-adds host.docker.internal; on Linux
      # Docker the host-gateway alias is needed explicitly.
      - "host.docker.internal:host-gateway"
    volumes:
      # Bind-mount the whole monorepo so workspace links resolve.
      - ${UI_REPO:-../..}:/ui
      # Named volume on node_modules — keeps host (macOS) and
      # container (Linux) compiled deps from clashing.
      - ui-node-modules:/ui/node_modules
    ports:
      - "5175:5173"

  # ─── browser UI — Vite dev server (apps/browser, the GemBrow port) ──
  # Public-facing browse/search frontend. Talks to Gemma 2.0 REST
  # (NOT local_api). Default upstream is the host's local Gemma 2.0
  # on :8080 via host.docker.internal; override with GEMMA_BASE_URL
  # to point at staging / prod or the in-stack ``gemma-rest`` service
  # when ``--profile gemma`` is on.
  browser-ui:
    build:
      context: .
      dockerfile: Dockerfile.browser
    image: gemma-local-mode/browser-ui:dev
    container_name: browser-ui
    working_dir: /ui
    environment:
      # Resolution order in apps/browser/vite.config.ts:
      #   1. GEMMA_BASE_URL env (this)
      #   2. fallback: staging Gemma 1.x
      # Default points at local Gemma 2.0 on the host (:8080); flip
      # via the env var when standing up against the in-stack
      # gemma-rest container or a remote target.
      GEMMA_BASE_URL: ${GEMMA_BROWSER_BACKEND:-http://host.docker.internal:8080}
      # Vite watcher fallback — bind-mounts on Docker-on-macOS don't
      # deliver inotify events from the host, so HMR misses workspace
      # package edits (@gemma/heatmap, @gemma/diagnostics, …) without
      # this. See apps/browser/vite.config.ts ``server.watch``.
      VITE_USE_POLLING: "1"
    extra_hosts:
      # Docker Desktop auto-adds host.docker.internal; on Linux
      # Docker the host-gateway alias is needed explicitly so the
      # browser can reach the host's :8080 Gemma 2.0.
      - "host.docker.internal:host-gateway"
    volumes:
      # Bind-mount the whole monorepo so workspace links resolve;
      # named volume on node_modules keeps host/container compiled
      # deps from clashing.
      - ${UI_REPO:-../..}:/ui
      - browser-node-modules:/ui/node_modules
    ports:
      - "5183:5183"

  # ─── optional Gemma 2.0 (Tomcat + WAR) ──────────────────────────
  # Bring up with ``./up.sh --gemma`` or
  # ``docker compose --profile gemma up``.
  gemma-rest:
    profiles: ["gemma"]
    image: tomcat:10.1-jdk25-temurin
    container_name: gemma-local-mode-gemma-rest
    depends_on:
      gemma-db:
        condition: service_healthy
    environment:
      GEMMA_DB_HOST: gemma-db
      GEMMA_DB_PORT: "3306"
      GEMMA_DB_NAME: ${GEMMA_DB_NAME:-gemd}
      GEMMA_DB_USER: ${GEMMA_DB_USER:-gemmaadmin}
      GEMMA_DB_PASSWORD: ${GEMMA_DB_PASSWORD:-gemmatoast}
      # MySQL 8 uses caching_sha2_password by default; without TLS, the
      # connector needs allowPublicKeyRetrieval=true to fetch the RSA
      # public key for the auth handshake. Safe in local-mode (no real
      # secrets on the wire). Default keeps useSSL=false from
      # default.properties intact.
      GEMMA_DB_URLQUERY: ${GEMMA_DB_URLQUERY:-useSSL=false&allowPublicKeyRetrieval=true}
      # MySQL 8.0.13 removed NO_AUTO_CREATE_USER from valid sql_mode
      # flags; default.properties line 90 still lists it for prod
      # (which runs MySQL 5.7). Drop the flag for local-mode's
      # MySQL 8.0 image so the connection-init SET sql_mode succeeds.
      GEMMA_DB_HIKARI_SESSIONVARIABLES: ${GEMMA_DB_HIKARI_SESSIONVARIABLES:-sql_mode='STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION'}
      GEMMA_SENTINELS_IGNORE: "true"
      CATALINA_OPTS: "-Dspring.profiles.active=production"
    volumes:
      # WAR bind-mount from the Gemma source tree. Override
      # GEMMA_WAR_PATH when running on a Linux box without the
      # eclipse workspace layout.
      - ${GEMMA_WAR_PATH:-${HOME}/Dev/eclipseworkspace/Gemma/gemma-rest/target/gemma-rest.war}:/usr/local/tomcat/webapps/ROOT.war:ro
    ports:
      - "8080:8080"

  gemma-db:
    profiles: ["gemma"]
    image: mysql:8.0
    container_name: gemma-local-mode-gemma-db
    environment:
      MYSQL_DATABASE: ${GEMMA_DB_NAME:-gemd}
      MYSQL_USER: ${GEMMA_DB_USER:-gemmaadmin}
      MYSQL_PASSWORD: ${GEMMA_DB_PASSWORD:-gemmatoast}
      MYSQL_ROOT_PASSWORD: ${GEMMA_DB_ROOT_PASSWORD:-gemmatoast}
    volumes:
      - gemma-db-data:/var/lib/mysql
      # /docker-entrypoint-initdb.d runs once on first start (empty
      # data volume) BEFORE the real MySQL server accepts external
      # connections — no race with downstream consumers.
      #
      # Bootstrap order:
      #   1. 01-apply-migrations.sh — sources every gemma-core
      #      V*__*.sql in numeric version order (sort -V) so V2
      #      lands before V10. Replaces the manual Flyway step prod
      #      relies on (gemma's DatabaseSchemaUpdatePopulator is a
      #      no-op stub).
      #   2. 99-groupadmin-seed.sql — local-mode admin user.
      #
      # Set ``GEMMA_REPO`` if the gemma checkout isn't at
      # ``$HOME/Dev/eclipseworkspace/Gemma``.
      - ${GEMMA_REPO:-${HOME}/Dev/eclipseworkspace/Gemma}/gemma-core/src/main/resources/db/migration/mysql:/gemma-migrations:ro
      - ./apply-gemma-migrations.sh:/docker-entrypoint-initdb.d/01-apply-migrations.sh:ro
      - ./groupadmin-seed.sql:/docker-entrypoint-initdb.d/99-groupadmin-seed.sql:ro
    # Host port 3307 (not 3306) — Paul's host MySQL holds 3306 for
    # gemdtest. The gemma-rest container reaches gemma-db over the
    # compose network on the internal 3306, so this mapping is purely
    # for host-side debugging (``mysql -h 127.0.0.1 -P 3307 -u root``).
    ports:
      - "${GEMMA_DB_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${GEMMA_DB_ROOT_PASSWORD:-gemmatoast}"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  ui-node-modules:
  browser-node-modules:
  gemma-db-data:
