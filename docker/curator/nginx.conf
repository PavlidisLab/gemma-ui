# nginx config for the curator-distribution curation UI.
#
# - Serves the Vite build under /
# - Single-page-app fallback so router routes don't 404 on reload
# - Proxies /rest/* → local-api (the curation backend in the same
#   compose stack); the SPA's relative ``/rest/v2/*`` fetches go
#   here. No CORS dance needed.
# - Proxies /propose, /audit, /find-* → proposer (optional; only
#   present when the ``--profile agents`` compose profile is active).
#   When proposer isn't running these 502 — the SPA already tolerates
#   that for the calibration-package review workflow.

server {
    listen 80;
    server_name _;

    # SPA — serve index.html for any unmatched route.
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived static assets get aggressive caching; the Vite build
    # hashes filenames so cache busts on rebuild.
    location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ─── /rest/* → local-api (mandatory backend) ─────────────────
    location /rest/ {
        proxy_pass         http://local-api:8000/rest/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Curators won't trigger long writes against local-api; a
        # 60s ceiling is generous.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ─── /propose, /audit, /find-* → proposer (optional) ─────────
    # These can be slow (LLM round-trip), so timeouts are disabled.
    location /propose/ {
        proxy_pass         http://proposer:8000/propose/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 0;
        proxy_send_timeout 0;
        proxy_buffering    off;
    }
    location /audit/ {
        proxy_pass         http://proposer:8000/audit/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 0;
        proxy_send_timeout 0;
        proxy_buffering    off;
    }
    location /find-term {
        proxy_pass         http://proposer:8000/find-term;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }
    location /find-publication/ {
        proxy_pass         http://proposer:8000/find-publication/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ─── /__health/* → liveness probes (used by TopBar HealthChip) ──
    # Rewritten to /openapi.json on each upstream so the probe needs
    # no agent-side endpoint. Matches the dev-mode Vite proxy rules.
    location = /__health/gemma {
        proxy_pass         http://local-api:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_connect_timeout 3s;
    }
    location = /__health/agent {
        proxy_pass         http://proposer:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_connect_timeout 3s;
    }
}
