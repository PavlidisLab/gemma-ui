<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Three rows, each one line cut into flat sections at staggered points.
       Round outer ends, square interior cuts, so a row reads as a divided
       line rather than as separate chips. Flat fills only: stepped gradients
       across adjacent light-warm values shimmer at small sizes.
       Field #0a4a5c sits BELOW the darkest bar (#b53825, L=0.128) in
       luminance. A lighter teal reads as fighting the bars because it
       lands in the same value band as the orange: #2a8da8 vs #f47f20
       is a contrast ratio of 1.44. Ground under signal, not beside it.
       The field is not decorative — cream carries the low end, and cream on
       white is invisible, so the mark cannot be used without it. -->
  <rect x="2" y="2" width="60" height="60" rx="13" fill="#0a4a5c"/>
  <path d="M25.84 11.00 H15.67 A5.67 5.67 0 0 0 15.67 22.33 H25.84 Z" fill="#b53825"/>
  <rect x="25.84" y="11.00" width="13.20" height="11.33" fill="#f47f20"/>
  <path d="M39.04 11.00 H48.33 A5.67 5.67 0 0 1 48.33 22.33 H39.04 Z" fill="#fcb536"/>
  <path d="M23.20 26.33 H15.67 A5.67 5.67 0 0 0 15.67 37.67 H23.20 Z" fill="#f47f20"/>
  <path d="M23.20 26.33 H48.33 A5.67 5.67 0 0 1 48.33 37.67 H23.20 Z" fill="#f9f7db"/>
  <path d="M32.88 41.67 H15.67 A5.67 5.67 0 0 0 15.67 53.00 H32.88 Z" fill="#f9f7db"/>
  <rect x="32.88" y="41.67" width="11.44" height="11.33" fill="#fcb536"/>
  <path d="M44.32 41.67 H48.33 A5.67 5.67 0 0 1 48.33 53.00 H44.32 Z" fill="#b53825"/>
</svg>
