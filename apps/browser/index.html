<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- favicon.svg carries the current mark; favicon.ico is the legacy
         fallback for clients that can't render an SVG icon. Browsers that
         support SVG icons prefer this one, so the SVG must be listed. Without
         it the .ico wins by default and updating favicon.svg has no visible
         effect at all. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="32x32" />

    <!-- Home-screen icons. iOS does NOT use an SVG favicon for the home
         screen and does not read the manifest for it either; without an
         apple-touch-icon it falls back to the 32px .ico and upscales, which
         is what a blurry home-screen icon is. These rasters are generated —
         `packages/assets/scripts/emit-app-icons.sh apps/browser`.

         `display: browser` in the manifest, and no
         `apple-mobile-web-app-capable`, so the icon still opens a normal
         browser tab with its URL bar and back button. Making it launch
         chrome-less is a one-line change in each, deliberately not taken
         here. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemma Browser</title>
  </head>
  <body class="bg-white text-gemma-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
